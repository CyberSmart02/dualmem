[project]
name = "dualmemory"
version = "0.0.1"
description = "Episodic + semantic memory layer for LLM agents, with provenance and validity windows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "CyberSmart02", email = "jagarlamudisai0602@gmail.com" }
]
keywords = ["llm", "memory", "agents", "rag", "episodic", "semantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/CyberSmart02/dualmem"
Repository = "https://github.com/CyberSmart02/dualmem"
Issues = "https://github.com/CyberSmart02/dualmem/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["DTZ"]

[tool.pytest.ini_options]
testpaths = ["tests"]